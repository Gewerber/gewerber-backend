name: gewerber_backend_client
description: Generated Serverpod client SDK for the Gewerber open-source backend.
version: 0.0.1
publish_to: none
repository: https://github.com/Gewerber/gewerber-backend
issue_tracker: https://github.com/Gewerber/gewerber-backend/issues
topics:
  - serverpod
  - client
  - sdk

environment:
  sdk: '^3.13.3'

resolution: workspace

dependencies:
  # The generated protocol embeds the `commercial` module caller
  # (lib/src/protocol/client.dart), so the module's client package is a real
  # compile-time dependency of this SDK. It is resolved against the public stub
  # package so that OSS consumers need no private access; release builds rewrite
  # the stubs URL to the real module via the git `insteadOf` rule (see the
  # server Dockerfile).
  gewerber_backend_commercial_client:
    git:
      url: https://github.com/Gewerber/gewerber-backend-stubs.git
      ref: develop
      path: gewerber_backend_commercial_client
  serverpod_auth_idp_client: 4.0.2
  serverpod_client: 4.0.2
