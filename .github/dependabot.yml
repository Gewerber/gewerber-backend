# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      dart-deps:
        patterns:
          - "*"
  - package-ecosystem: "pub"
    directory: "/gewerber_backend_client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      dart-deps:
        patterns:
          - "*"
  - package-ecosystem: "pub"
    directory: "/gewerber_backend_server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      dart-deps:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/gewerber_backend_server"
    schedule:
      interval: "monthly"
