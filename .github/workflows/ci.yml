# Continuous integration for the open-source backend.
#
# Four independent jobs, so that one unavailable input cannot take down the
# whole pipeline:
#
#   - `analyze`              -- `dart analyze`, a format check and the DB-free
#                               unit tests. No service containers, no secrets, so
#                               it runs on every event including Dependabot and
#                               pull requests from forks.
#   - `integration-tests`    -- the `withServerpod` suites against a disposable
#                               PostgreSQL. Job-level `if` gate, see below.
#   - `privacy-guard`        -- the open-core boundary check (see its own comment).
#   - `xrechnung-validation` -- the official KoSIT validator over committed fixtures.
#
# Merge gate. Ruleset "Base branch rules" (id 21196406) requires status checks
# on `main` and `develop`, and the context it matches is the job's `name:` --
# not the job's key. So renaming, adding or removing a job breaks the merge
# gate until the ruleset is updated, and it breaks *silently*: the legacy
# `branches/<name>/protection` endpoint 404s with "Branch not protected"
# because the rule actually lives in a ruleset. Editing a ruleset is an
# operator action; agents must not do it. Re-check this list whenever a job
# `name:` changes:
#
#   - `Analyze, format & unit tests`
#   - `Integration tests (Postgres)`
#   - `Open-core privacy guard`
#   - `XRechnung / EN 16931 validation`
#
# Why the split (issue #96): GitHub does not pass repository secrets to
# workflows triggered by Dependabot events, nor to pull requests from forks.
# While the PostgreSQL service container's password came from
# `secrets.TEST_DATABASE_PASSWORD`, such runs rendered the secret as an empty
# string, `docker create` received a bare `-e "POSTGRES_PASSWORD"`, and the job
# died in `Initialize containers` before a single step ran -- taking `dart
# analyze` down with it, so Dependabot PRs could never go green.
#
# The gate. Making the service container optional means gating the *job*, not
# the steps: GitHub provisions service containers for a whole job, before any
# step runs, so a step-level condition cannot help. `secrets` is not available
# in a job-level `if:`, so the gate is expressed through the `github` context:
# any non-`pull_request` event runs, and a `pull_request` runs only when its
# head repository is this repository and the actor is not `dependabot[bot]`.
# The `analyze` job carries the logical negation of that predicate (ANDed with
# `!cancelled()`, so it does not print on a cancelled run) as the condition of
# a notice step, so a skipped run explains itself in the log instead of
# silently rendering a grey check. Keep the two expressions in sync -- they
# are duplicated deliberately, and `!cancelled()` is load-bearing: it is what
# stops the notice firing when the job it is announcing was merely cancelled.
#
# The gate is a heuristic: it cannot detect a secret that exists but is EMPTY,
# which still fails in `Initialize containers` with a confusing message. A
# probe-and-pass-output gate would close that gap but serialises
# `integration-tests` behind `analyze`; tracked as a follow-up in #96.
#
# Repository secret: `TEST_DATABASE_PASSWORD` is the password of the disposable
# PostgreSQL service container. It is not, and must not become, the local
# dev/test passwords from gewerber_backend_server/docker-compose.yaml -- those
# live in the gitignored .env (issue #90). Any strong value works; the database
# is discarded after each run. It is never echoed: only the generated
# config/passwords.yaml receives it, and that file is gitignored.
#
# The test database mirrors gewerber_backend_server/docker-compose.yaml
# (`postgres_test`) and config/test.yaml: port 9090, user postgres, database
# gewerber_backend_test. TEST_DATABASE_PASSWORD must match the `test.database`
# entry written into config/passwords.yaml by the `integration-tests` job.
#
# The commercial module dependency still resolves against the public
# gewerber-backend-stubs repository. Developers with access to the private
# module resolve it locally via a gitignored pubspec_overrides.yaml.

name: CI

# Also callable as a reusable workflow: `.github/workflows/deploy.yml` invokes
# it as its first job so a red build can never reach the VPS (same pattern as
# gewerber-app).
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
    inputs:
      deploy_gate:
        description: >-
          Set by the Deploy workflow. Moves the run into its own concurrency
          group and disables cancellation, so a newer push can never cancel the
          CI gate that a deployment is waiting on.
        type: boolean
        default: false
    # A reusable workflow must DECLARE every secret its caller passes. An
    # undeclared one is not a runtime warning but a PARSE error in the caller:
    # the entire Deploy run dies with `startup_failure` before a single job is
    # created — no steps, no logs, no annotations (#101).
    #
    # `required: false`, not true: push and pull_request runs have no caller
    # and no secret, and the empty-password guard in `integration-tests` already
    # reports that case with actionable instructions.
    secrets:
      TEST_DATABASE_PASSWORD:
        description: >-
          Password for the disposable postgres_test service container. The
          Deploy gate passes it from a repository-level secret, because a job
          calling a reusable workflow cannot declare `environment:` and so
          cannot read environment-level secrets.
        required: false

# `github.ref` alone is not a unique key for this workflow: the push-triggered
# run and the Deploy workflow's `workflow_call` instance of this same file
# resolve to the SAME ref, so under `cancel-in-progress: true` one cancels the
# other — a cancelled gate blocks a legitimate deployment, and a cancelled
# required check leaves branch protection reporting a check that never
# finished. The gate therefore gets its own group and is never cancelled.
#
# `inputs` is empty for push/pull_request runs, so those keep cancelling as
# before (`!null` is true) and keep their historical group suffix `run`.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.deploy_gate && 'gate' || 'run' }}
  cancel-in-progress: ${{ !inputs.deploy_gate }}

jobs:
  # Secret-free by construction: no `services:`, no `secrets.*`. That is what
  # makes it safe and always-runnable for Dependabot events and fork PRs.
  analyze:
    name: Analyze, format & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # First, deliberately. A skipped job cannot print anything, so the
      # explanation has to come from the job that DOES run -- and it has to be
      # reachable even when a later step fails, or a red Dependabot run would
      # show a grey skipped check with no account of why. Being first also
      # keeps the claim made below independent of what the rest of the job
      # ends up doing.
      #
      # The condition is the logical negation of the `integration-tests`
      # job-level `if`, ANDed with `!cancelled()` -- keep the two in sync.
      - name: Explain the skipped DB-backed job
        if: >-
          !cancelled() &&
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.actor == 'dependabot[bot]')
        run: |
          echo "::notice title=Integration tests skipped::GitHub does not pass repository secrets to Dependabot events or to pull requests from forks, so the DB-backed \`integration-tests\` job was skipped for this run. This job still covers \`dart analyze\`, formatting and the DB-free unit tests under test/unit; the \`withServerpod\` integration suites did not run. Tracked in #96."

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          # The declared SDK floor (pubspec.yaml: ^3.13.3 in all three
          # packages), pinned deliberately: analyzing on the oldest supported
          # SDK is a smoke test, not a duplicate of whatever the Docker image
          # happens to use.
          sdk: '3.13.3'

      # Select the public stub ref explicitly for the CI target branch. The
      # retarget script fails closed when that ref is incompatible with this
      # repository's pinned Serverpod/tooling, rather than silently using an
      # unrelated ref (release-train sync, see stubs#26).
      - name: Inter-repo deps follow the target branch
        if: github.ref_name == 'develop' || github.base_ref == 'develop'
        run: sh gewerber_backend_server/tool/retarget_gewerber_refs.sh develop

      - name: Inter-repo deps follow the main target branch
        if: github.ref_name == 'main' || github.base_ref == 'main'
        run: sh gewerber_backend_server/tool/retarget_gewerber_refs.sh main

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      # Hand-written Dart only. `dart format` does not read the
      # `analyzer.exclude` list in analysis_options.yaml and has no exclude
      # flag, so `dart format .` would rewrite the Serverpod-generated trees
      # that `privacy-guard` pins byte-for-byte (issue #71). Enumerate the
      # tracked files and subtract exactly the three generated trees that
      # `privacy-guard` also diffs, so a new hand-written file is covered
      # automatically. `--output=none` makes this read-only.
      - name: Check formatting
        run: |
          git ls-files -z -- '*.dart' \
            ':(exclude)gewerber_backend_server/lib/src/generated/**' \
            ':(exclude)gewerber_backend_client/lib/src/protocol/**' \
            ':(exclude)gewerber_backend_server/test/integration/test_tools/**' \
            | xargs -0 -r dart format --output=none --set-exit-if-changed

      # The suites under test/unit import neither serverpod_test nor the
      # generated integration harness, so they need no database and no
      # config/passwords.yaml. That is precisely what lets this job run on
      # secret-less events. The withServerpod suites under test/integration do
      # need a database -- they live in `integration-tests`.
      - name: Run unit tests
        run: dart test test/unit
        working-directory: gewerber_backend_server

  integration-tests:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `secrets` is not available in a job-level `if:`, so secret availability
    # is approximated through the `github` context: only a push, or a
    # pull_request from a branch of this repository opened by someone other
    # than Dependabot, is guaranteed to have the password. Keep this in sync
    # with the negation in the `analyze` job's notice step above.
    #
    # `github.actor`, not `github.triggering_actor`, and that is deliberate.
    # On a re-run the two differ: `actor` stays the *original* event's actor
    # (`dependabot[bot]`) while `triggering_actor` is whoever clicked re-run.
    # Secret availability is a property of the event, not of the person who
    # re-triggered it, so a maintainer re-running a Dependabot PR must still
    # get the skip. Do not "fix" this to `triggering_actor`.
    #
    # The gate keys on one actor string, so a bot that is not Dependabot
    # (`github-actions[bot]`, a future Renovate, the old `dependabot-preview`)
    # would still fail in `Initialize containers` with the empty secret. That
    # is a CI outage, not a leak; widen the exclusion if such a bot is adopted.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]')

    services:
      postgres_test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: gewerber_backend_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_DATABASE_PASSWORD }}
        ports:
          - 9090:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gewerber_backend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DATABASE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      # Select the public stub ref explicitly for the CI target branch. The
      # retarget script fails closed when that ref is incompatible with this
      # repository's pinned Serverpod/tooling, rather than silently using an
      # unrelated ref (release-train sync, see stubs#26).
      #
      # This setup block is duplicated verbatim across `analyze`,
      # `integration-tests` and `privacy-guard` rather than factored into a
      # composite action: the guard predates the split and cannot be refactored
      # safely in one go, so a composite action would leave two shapes in play
      # instead of three. When you change anything here, change it in all
      # three copies -- the `sdk:` literal is the only thing that can drift.
      - name: Inter-repo deps follow the target branch
        if: github.ref_name == 'develop' || github.base_ref == 'develop'
        run: sh gewerber_backend_server/tool/retarget_gewerber_refs.sh develop

      - name: Inter-repo deps follow the main target branch
        if: github.ref_name == 'main' || github.base_ref == 'main'
        run: sh gewerber_backend_server/tool/retarget_gewerber_refs.sh main

      - name: Install dependencies
        run: dart pub get

      # Fail with an actionable message instead of letting the postgres_test
      # service container die on an empty password. This is the one failure mode
      # the Deploy gate introduces: a job that calls a reusable workflow cannot
      # declare `environment:`, so only REPOSITORY-level secrets reach ci.yml.
      # If TEST_DATABASE_PASSWORD is configured per environment instead, the
      # gate is red on every deploy while ordinary runs stay green.
      - name: Verify test database secret is available
        env:
          TEST_DATABASE_PASSWORD: ${{ env.TEST_DATABASE_PASSWORD }}
        run: |
          if [ -z "$TEST_DATABASE_PASSWORD" ]; then
            echo '::error::TEST_DATABASE_PASSWORD is empty. Configure it as a REPOSITORY secret (Settings -> Secrets and variables -> Actions), not per environment: a job calling a reusable workflow cannot declare `environment:`, so environment-level secrets are out of scope.'
            exit 1
          fi

      # Report (do not enforce) which commercial module package the resolution
      # picked up. This repository resolves the PUBLIC STUBS by design — that is
      # what keeps it buildable without private access — so this step only makes
      # the choice visible in the log. The release image build enforces the
      # opposite (see gewerber_backend_server/Dockerfile).
      - name: Report commercial module resolution
        run: dart run gewerber_backend_server/tool/check_commercial_resolution.dart

      # config/passwords.yaml is gitignored; recreate it for the test run mode
      # so it matches the credentials of the postgres_test service container.
      - name: Write test passwords
        env:
          TEST_DATABASE_PASSWORD: ${{ env.TEST_DATABASE_PASSWORD }}
        run: |
          cat > gewerber_backend_server/config/passwords.yaml <<EOF
          # Generated by CI — throwaway test credentials only.
          test:
            database: '${TEST_DATABASE_PASSWORD}'
            emailSecretHashPepper: 'Gd0l-zE78Sd6DdCGILUOjfaT1Pf5AgFJ'
            jwtHmacSha512PrivateKey: 'qHd0_wmU6gIuyWpUfmySBbTrN82sPJm6'
            jwtRefreshTokenHashPepper: 'u83P8MdX1jbOuaxpt4SnOx3ei3Gqdscg'

            smtpHost: ''
            smtpPort: '587'
            smtpUsername: ''
            smtpPassword: ''
            smtpFromAddress: ''
            smtpFromName: 'Gewerber'
            smtpSsl: 'false'
          EOF

      # Unchanged from the old `test` job: still the whole suite, so the DB
      # path stays byte-identical to what runs today. The test/unit suites
      # therefore run twice per push -- once here without a database and once
      # as part of the full suite. That redundancy is the price of not
      # changing the proven command; it costs a few seconds.
      - name: Run tests
        run: dart test
        working-directory: gewerber_backend_server

  # Open-core privacy guard.
  #
  # The closed-source module is compiled into OSS builds through the public
  # stub packages in gewerber-backend-stubs. The stubs define the public
  # contract; this job asserts that this repository (source, generated code,
  # and committed migrations) never reaches past it, so the private module's
  # shape cannot leak back in through a merge or a stale artifact.
  #
  # Checks are deliberately anchored to *package-qualified* names rather than
  # bare keywords: the OSS core legitimately owns a `payment` endpoint, a
  # `PaymentMethod.paypal` value and a `Feature.subscriptions` capability
  # flag, so a naive `grep -E 'plan|subscription|paypal'` would fail on
  # public code. When the public contract changes, update the allow-lists here
  # together with AGENTS.md.
  privacy-guard:
    name: Open-core privacy guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Module-owned tables an OSS build may reference. Anything else under
      # `commercial_*` belongs to the private module and must not appear in
      # generated protocol or committed migrations.
      MODULE_TABLE_ALLOWLIST: commercial_waitlist_entry
      # Endpoints reachable as `client.modules.commercial.<name>`.
      MODULE_ENDPOINT_ALLOWLIST: commercial waitlist
      # Exact Serverpod CLI version pinned by the workspace; the guard must
      # regenerate with the same code generator that produced the artifacts.
      #
      # This is deliberately NOT a literal. It used to be `SERVERPOD_VERSION:
      # 4.0.3` hardcoded here, which is precisely how the train drifted: the
      # packages were bumped three times and this line was forgotten, so the
      # guard regenerated with a CLI that no longer matched the packages (see
      # #73). It is now derived from pubspec.lock in the "Install Serverpod
      # CLI" step below, which cannot drift from what pub resolved.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      # Select the public stub ref explicitly for the CI target branch. The
      # retarget script fails closed when that ref is incompatible with this
      # repository's pinned Serverpod/tooling, rather than silently using an
      # unrelated ref (release-train sync, see stubs#26).
      - name: Inter-repo deps follow the target branch
        if: github.ref_name == 'develop' || github.base_ref == 'develop'
        run: sh gewerber_backend_server/tool/retarget_gewerber_refs.sh develop

      - name: Inter-repo deps follow the main target branch
        if: github.ref_name == 'main' || github.base_ref == 'main'
        run: sh gewerber_backend_server/tool/retarget_gewerber_refs.sh main

      - name: Install dependencies
        run: dart pub get

      - name: Reject deep imports into the module's private src/ tree
        run: |
          if grep -rn --include='*.dart' \
              'gewerber_backend_commercial_server/src' \
              gewerber_backend_server/lib \
              gewerber_backend_server/test \
              gewerber_backend_client/lib; then
            echo '::error::OSS code must import the commercial module through its public barrel, never through a src/ path.'
            exit 1
          fi

      - name: Reject module callers outside the public contract
        run: |
          matches="$(grep -rhoE --include='*.dart' \
            '(client\.commercial|modules\.commercial)\.[A-Za-z0-9_]+' \
            gewerber_backend_server/lib \
            gewerber_backend_server/test \
            gewerber_backend_server/bin \
            gewerber_backend_client/lib || true)"
          offender=''
          for match in $matches; do
            name="${match##*.}"
            case " $MODULE_ENDPOINT_ALLOWLIST " in
              *" $name "*) ;;
              *) offender="$offender$match"$'\n' ;;
            esac
          done
          if [ -n "$offender" ]; then
            printf '%s' "$offender"
            echo "::error::OSS code references commercial module callers outside the public contract (allowed: $MODULE_ENDPOINT_ALLOWLIST)."
            exit 1
          fi

      - name: Reject private module tables in committed migrations
        run: |
          tables="$(grep -rhoE 'CREATE TABLE "commercial_[A-Za-z0-9_]+"' \
            gewerber_backend_server/migrations | sed -E 's/.*"(.*)".*/\1/' | sort -u || true)"
          offender=''
          for table in $tables; do
            case " $MODULE_TABLE_ALLOWLIST " in
              *" $table "*) ;;
              *) offender="$offender$table"$'\n' ;;
            esac
          done
          if [ -n "$offender" ]; then
            printf '%s' "$offender"
            echo "::error::OSS migrations create commercial module tables outside the public contract (allowed: $MODULE_TABLE_ALLOWLIST)."
            exit 1
          fi

      - name: Reject stale module schema versions in the migration chain
        run: |
          # Serverpod merges a module's migrations into the project chain when
          # `serverpod create-migration` runs, then stamps the module's version
          # into `serverpod_migrations` at apply time. If the recorded version
          # is not one the resolved module ships, the project chain holds a
          # *stale copy* of the module schema: the generated model declares
          # columns the committed SQL never creates, and inserts fail at
          # runtime with an undefined_column error. Regenerate the migration
          # (`serverpod create-migration`) after any module update.
          python3 tool/check_module_schema_versions.py \
            gewerber_backend_server/migrations \
            .dart_tool/package_config.json \
            gewerber_backend_commercial_server

      # Regenerating with the pinned CLI must reproduce the committed artifacts
      # byte for byte. This catches hand-edited generated files and drift
      # against the stub packages (the class of bug that let merge-conflict
      # markers into `client.dart` once before).
      #
      # The CLI version is read from pubspec.lock -- the version pub actually
      # resolved -- rather than from a literal or from the pubspec constraint.
      # The constraint is a caret range, and activating the CLI with a range
      # would install whatever the newest 4.x was at run time, so a newer CLI
      # could emit artifacts the committed ones do not match. `dart pub get`
      # has already run above, so the lockfile is current.
      - name: Install Serverpod CLI
        run: |
          version="$(awk '
            /^  serverpod:$/ { hit = 1; next }
            hit && /^    version:/ { gsub(/"/, "", $2); print $2; exit }
            hit && /^  [a-zA-Z_]/ { exit }
          ' pubspec.lock)"
          if [ -z "$version" ]; then
            echo "::error::could not read the resolved serverpod version from pubspec.lock"
            exit 1
          fi
          echo "Activating serverpod_cli $version (resolved from pubspec.lock)"
          dart pub global activate serverpod_cli "$version"

      - name: Verify generated artifacts are up to date
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          (cd gewerber_backend_server && serverpod generate --force)
          if ! git diff --exit-code -- \
              gewerber_backend_server/lib/src/generated \
              gewerber_backend_server/migrations/migration_registry.txt \
              gewerber_backend_server/test/integration/test_tools/serverpod_test_tools.dart \
              gewerber_backend_client/lib/src/protocol; then
            git diff --stat -- \
              gewerber_backend_server/lib/src/generated \
              gewerber_backend_client/lib/src/protocol
            echo '::error::generated protocol/endpoints are out of sync with the models and the resolved module. Run `serverpod generate` and commit the result.'
            exit 1
          fi
          if ! (generated_status="$(git status --porcelain --untracked-files=all -- \
              gewerber_backend_server/lib/src/generated \
              gewerber_backend_server/migrations/migration_registry.txt \
              gewerber_backend_server/test/integration/test_tools/serverpod_test_tools.dart \
              gewerber_backend_client/lib/src/protocol)" && [ -z "$generated_status" ]); then
            echo '::error::generated protocol/endpoints are out of sync with the models and the resolved module. Run `serverpod generate` and commit the result.'
            exit 1
          fi

  # XRechnung / EN 16931 spec conformance.
  #
  # The unit tests assert the serializer against *its own* expectations, which
  # catches regressions but not spec violations. This job runs the committed
  # fixtures through the official KoSIT validator with the official
  # XRechnung 3.0.2 configuration, which is the only thing that can back the
  # "valid XRechnung" claim (see #76).
  #
  # It is deliberately independent of the Dart/Postgres jobs: it needs neither
  # the Dart toolchain nor a database, because it validates the *committed*
  # fixtures. The fixtures themselves are pinned byte-for-byte by the golden
  # test in the `analyze` job, so the two together mean "the committed output is
  # unchanged AND unchanged output passes the official validator".
  #
  # No repository secrets are required: both artifacts are public downloads
  # pinned by sha256 inside tool/validate_xrechnung.sh, which fails closed on a
  # hash mismatch rather than validating an unverified artifact.
  xrechnung-validation:
    name: XRechnung / EN 16931 validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Persisted across runs by actions/cache below; the script verifies the
      # pinned sha256 on every run, not only on download.
      XR_VALIDATOR_CACHE: ${{ github.workspace }}/.xrechnung-validator-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The validator jar (10 MB) and the XRechnung configuration zip are
      # immutable, versioned artifacts; caching them keeps the job off Maven
      # Central / the GitHub release CDN on every run.
      - name: Cache KoSIT validator artifacts
        uses: actions/cache@v6
        with:
          path: ${{ env.XR_VALIDATOR_CACHE }}
          key: kosit-validator-1.6.3-xrechnung-3.0.2-v2026-08-31

      - name: Validate XRechnung fixtures
        run: bash gewerber_backend_server/tool/validate_xrechnung.sh

      # Keep the full reports when the job fails: the script prints the failing
      # rule ids and messages to the log, but the report XML carries the line
      # numbers and the document context needed to fix a new violation.
      - name: Upload validation reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xrechnung-validation-reports
          path: ${{ env.XR_VALIDATOR_CACHE }}/reports
          if-no-files-found: ignore
