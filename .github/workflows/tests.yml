name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.0-beta.2'
      SERVERPOD_PASSWORD_database: '-090vJlpK146u7T0YCGz9xnT6JOxJg4x'
      SERVERPOD_PASSWORD_redis: 'xldSfuP1X68IFOoQDDW07mNCeE5MZHQ0'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Start containers
        working-directory: gewerber_backend_server
        run: docker compose up --quiet-pull --build -d

      - name: Configure git for private dependencies
        env:
          COMMERCIAL_REPO_TOKEN: ${{ secrets.COMMERCIAL_REPO_TOKEN }}
        run: |
          if [ -z "$COMMERCIAL_REPO_TOKEN" ]; then
            echo "::error::Secret COMMERCIAL_REPO_TOKEN is not set. Create a token with read access to the private gewerber-backend-commercial repository (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          git config --global url."https://x-access-token:${COMMERCIAL_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart pub global activate serverpod_cli $VERSION
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Run Serverpod generator
        working-directory: gewerber_backend_server
        run: serverpod generate

      - name: Run tests
        working-directory: gewerber_backend_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: gewerber_backend_server
        run: docker compose down -v
