name: gewerber_backend_server
description: Serverpod backend server for the Gewerber open-source core (auth, invoicing, time tracking, guidance).
version: 0.0.1
publish_to: none
repository: https://github.com/Gewerber/gewerber-backend
issue_tracker: https://github.com/Gewerber/gewerber-backend/issues
topics:
  - serverpod
  - backend
  - invoicing
  - time-tracking
  - germany

environment:
  sdk: '^3.13.3'

resolution: workspace

dependencies:
  archive: ^4.3.0
  get_it: ^9.3.0
  gewerber_backend_commercial_server:
    git:
      url: https://github.com/Gewerber/gewerber-backend-stubs.git
      ref: develop
      path: gewerber_backend_commercial_server
  injectable: ^3.0.0
  mailer: ^7.2.0
  pdf: ^3.13.1
  # Exact pin, not a caret range: the repo pins Serverpod exactly and
  # `serverpod generate` warns that a version range "can cause a mismatch with
  # Serverpod's CLI version". Keep in lockstep with gewerber_backend_client and
  # the stubs repo (one release train). A bump is a deliberate change here plus
  # `dart pub global activate serverpod_cli <version>`; the generated artifacts
  # are committed, so a silently resolved patch release (as in CI, which has no
  # committed lockfile) otherwise drifts the artifacts from the CLI that
  # regenerated them.
  serverpod: 4.1.2
  serverpod_auth_core_server: 4.1.2
  serverpod_auth_idp_server: 4.1.2

dev_dependencies:
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.1.2
  test: ^1.32.0

