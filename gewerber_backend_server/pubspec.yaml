name: gewerber_backend_server
description: Serverpod backend server for the Gewerber open-source core (auth, invoicing, time tracking, guidance).
version: 0.0.1
publish_to: none
repository: https://github.com/Gewerber/gewerber-backend
issue_tracker: https://github.com/Gewerber/gewerber-backend/issues
topics:
  - serverpod
  - backend
  - invoicing
  - time-tracking
  - germany

environment:
  sdk: '^3.13.3'

resolution: workspace

dependencies:
  archive: ^4.3.0
  get_it: ^9.3.0
  gewerber_backend_commercial_server:
    git:
      url: https://github.com/Gewerber/gewerber-backend-stubs.git
      ref: develop
      path: gewerber_backend_commercial_server
  injectable: ^3.0.0
  mailer: ^7.2.0
  pdf: ^3.13.1
  # Caret floor, not an exact pin. `^4.0.3` takes patch releases automatically
  # while making a drop below 4.0.3 -- notably the `4.0.0-rc.1` pre-release that
  # gewerber-backend-stubs pinned on main -- structurally impossible: a caret
  # range never selects a pre-release. Keep in lockstep with
  # gewerber_backend_client and the stubs repo (one release train).
  #
  # `serverpod generate` warns that a version range "can cause a mismatch with
  # Serverpod's CLI version" and prefers an exact pin. Accepted deliberately:
  # the privacy-guard job activates serverpod_cli at the version pub actually
  # resolved (pubspec.lock), so CI cannot mismatch. A developer with an older
  # global serverpod_cli can, so run
  # `dart pub global activate serverpod_cli <resolved version>` when bumping.
  serverpod: ^4.0.3
  serverpod_auth_core_server: ^4.0.3
  serverpod_auth_idp_server: ^4.0.3

dev_dependencies:
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: ^4.0.3
  test: ^1.32.0

