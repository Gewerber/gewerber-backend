name: gewerber_backend_server
description: Serverpod backend server for the Gewerber open-source core (auth, invoicing, time tracking, guidance).
version: 0.0.1
publish_to: none
repository: https://github.com/Gewerber/gewerber-backend-core
issue_tracker: https://github.com/Gewerber/gewerber-backend-core/issues
topics:
  - serverpod
  - backend
  - invoicing
  - time-tracking
  - germany

environment:
  sdk: '^3.12.0'

resolution: workspace

dependencies:
  archive: ^4.0.0
  get_it: ^9.2.1
  gewerber_commercial_server:
    git:
      url: https://github.com/Gewerber/gewerber-backend--stubs.git
      ref: main
      path: gewerber_commercial_server
  injectable: ^3.0.0
  mailer: ^7.2.0
  pdf: ^3.13.0
  serverpod: 4.0.0-beta.3
  serverpod_auth_idp_server: 4.0.0-beta.3

dev_dependencies:
  build_runner: ^2.16.0
  injectable_generator: ^3.1.2
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.0-beta.3
  test: ^1.25.5

