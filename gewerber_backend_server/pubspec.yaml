name: gewerber_backend_server
description: Serverpod backend server for the Gewerber open-source core (auth, invoicing, time tracking, guidance).
version: 0.0.1
publish_to: none
repository: https://github.com/Gewerber/gewerber-backend-core
issue_tracker: https://github.com/Gewerber/gewerber-backend-core/issues
topics:
  - serverpod
  - backend
  - invoicing
  - time-tracking
  - germany

environment:
  sdk: '^3.12.0'

resolution: workspace

dependencies:
  get_it: ^9.2.1
  injectable: ^3.0.0
  serverpod: 4.0.0-beta.0
  serverpod_auth_idp_server: 4.0.0-beta.0

dev_dependencies:
  build_runner: ^2.16.0
  injectable_generator: ^3.1.2
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.0-beta.0
  test: ^1.25.5

