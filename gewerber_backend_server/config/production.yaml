# Production configuration for the VPS deployment (see deploy/).
#
# Topology (deploy/docker-compose.yml): the server runs next to a `postgres`
# and a `redis` container on an internal Docker network; Traefik terminates
# TLS and routes https://api.gewerber.de to the API server (port 8080). The
# Insights server (port 8081) is only reachable on the internal network and
# is protected by the `serviceSecret` from config/passwords.yaml.

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: api.gewerber.de
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server (internal only, not exposed publicly).
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

# The database setup for production. The `postgres` service is defined in
# deploy/docker-compose.yml. The password comes from the `production.database`
# key of config/passwords.yaml (generated by deploy/deploy.sh on the VPS).
database:
  host: postgres
  port: 5432
  name: gewerber_backend
  user: postgres

# Redis (cache + cross-server messaging). The `redis` service is defined in
# deploy/docker-compose.yml; the password comes from the `production.redis`
# key of config/passwords.yaml.
redis:
  host: redis
  port: 6379

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

# WebSocket / cookie origin allow-list: only these browser origins may open
# WebSocket connections and receive auth cookies.
allowedOrigins:
  - https://app.gewerber.de

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text
  retentionPeriod: 30d
  cleanupInterval: 1h

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative value or null removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000
