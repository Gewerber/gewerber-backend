class: BusinessSettings
table: business_settings
fields:
  businessId: int, relation(parent=business, onDelete=Cascade)
  paymentTermsDays: int, default=14
  ### Payment instructions (BG-16) for the XRechnung export: BT-84 IBAN,
  ### BT-86 BIC, BT-85 account holder. Nullable because these columns are
  ### added to an existing table.
  iban: String?
  bic: String?
  accountHolder: String?
  invoiceNumberPrefix: String?
  invoiceNumberIncludeYear: bool, default=true
  invoiceNumberMinDigits: int, default=4
  roundingMode: RoundingMode, default=none
  roundingGranularityMinutes: int, default=1
  updatedAt: DateTime, default=now
indexes:
  business_settings_business_unique_idx:
    fields: businessId
    unique: true
