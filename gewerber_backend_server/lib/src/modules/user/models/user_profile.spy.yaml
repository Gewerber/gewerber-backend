class: UserProfile
table: user_profile
fields:
  userId: UuidValue
  displayName: String?
  locale: Locale, default=de
  timeZone: String?
  themeMode: AppTheme, default=system
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
  ### Set when the account was soft-deleted (GDPR Art. 17). Personal links in
  ### business tables are severed at the same moment; business data is kept
  ### (GoBD retention). A non-null value means the account must not be usable.
  deletedAt: DateTime?
indexes:
  user_profile_user_unique_idx:
    fields: userId
    unique: true
