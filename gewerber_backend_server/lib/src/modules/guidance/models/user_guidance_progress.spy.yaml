class: UserGuidanceProgress
table: user_guidance_progress
fields:
  ### Nullable: set to null when the account is deleted (GDPR Art. 17).
  userId: UuidValue?
  itemKey: String
  completedAt: DateTime?
  dismissedAt: DateTime?
  updatedAt: DateTime, default=now
indexes:
  user_guidance_progress_unique_idx:
    fields: userId, itemKey
    unique: true
