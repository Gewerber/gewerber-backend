class: TimeEntry
table: time_entry
fields:
  businessId: int, relation(parent=business, onDelete=Cascade)
  projectId: int?, relation(parent=project, onDelete=SetNull)
  taskId: int?, relation(parent=task, onDelete=SetNull)
  description: String?
  startedAt: DateTime
  stoppedAt: DateTime?
  durationMinutes: int?
  billable: bool, default=true
  invoicedAt: DateTime?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  time_entry_business_started_idx:
    fields: businessId, startedAt
  time_entry_project_idx:
    fields: projectId
  time_entry_task_idx:
    fields: taskId
  # DB-level guarantee that only one timer runs per business: at most one row
  # per businessId with a NULL stoppedAt (NULLs are treated as equal, so they
  # collide; stopped entries carry distinct timestamps or NULL-safe values).
  time_entry_business_running_idx:
    fields: businessId, stoppedAt
    unique: true
    nulls_distinct: false
