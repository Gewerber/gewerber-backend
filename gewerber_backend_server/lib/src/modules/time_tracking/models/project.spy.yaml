class: Project
table: project
fields:
  businessId: int, relation(parent=business, onDelete=Cascade)
  name: String
  status: ProjectStatus, default=active
  customerId: int?, relation(parent=customer, onDelete=SetNull)
  hourlyRateCents: int?
  notes: String?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  project_business_idx:
    fields: businessId, status
