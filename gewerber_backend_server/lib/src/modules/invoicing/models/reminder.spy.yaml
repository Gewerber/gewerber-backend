class: Reminder
table: reminder
fields:
  invoiceId: int, relation(parent=invoice, onDelete=Cascade)
  level: int
  # true = the email was actually sent or logged-only (dev); false = the
  # mail delivery failed and no dunning level bump happened.
  sent: bool, default=false
  sentAt: DateTime, default=now
indexes:
  reminder_invoice_idx:
    fields: invoiceId
