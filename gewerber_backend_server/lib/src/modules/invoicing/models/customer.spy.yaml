class: Customer
table: customer
fields:
  businessId: int, relation(parent=business, onDelete=Cascade)
  status: CustomerStatus, default=active
  name: String
  companyName: String?
  vatId: String?
  ### BT-10 "Buyer reference" required by BR-DE-15 in the XRechnung export; buyer-assigned, e.g. Leitweg-ID for public clients.
  buyerReference: String?
  email: String?
  phone: String?
  address: Address?
  notes: String?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  customer_business_idx:
    fields: businessId, status
