# Deploys the Gewerber Serverpod backend behind an existing Traefik reverse
# proxy. The same file serves both environments:
#
#   production : api.gewerber.de      gwb       gewerber-backend       (runmode=production)
#   staging    : api.test.gewerber.de gwb-test  gewerber-backend-test  (runmode=staging)
#
# Stack per environment: Serverpod API server + PostgreSQL + Redis. Only the
# API server (port 8080) is exposed through Traefik; the Insights server
# (8081) stays on the internal network, protected by the service secret.
#
# Locally you can `docker compose build && docker compose up -d` (image built
# from `gewerber_backend_server/Dockerfile`, context = repo root). In CI the
# image is built once, pushed to GHCR, and the VPS only pulls it (see
# .github/workflows/deploy.yml and deploy/deploy.sh).
#
# `deploy.sh` generates the `.env` (image, host rule, secrets) and
# `config/passwords.yaml` consumed by the server container.

services:
  server:
    image: ${IMAGE:-ghcr.io/gewerber/gewerber-backend:latest}
    build:
      context: ..
      dockerfile: gewerber_backend_server/Dockerfile
    container_name: ${CONTAINER_NAME:-gewerber-backend}
    restart: unless-stopped
    environment:
      # Serverpod run mode: production | staging (selects config/<runmode>.yaml
      # and the matching passwords section).
      runmode: ${RUNMODE:-production}
      # Apply pending database migrations on startup.
      SERVERPOD_APPLY_MIGRATIONS: "true"
    volumes:
      # Generated by deploy/deploy.sh; not part of the image.
      - ./config/passwords.yaml:/app/config/passwords.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Resource limits (honored by `docker compose up`, not just Swarm).
    # Defaults suit a small VPS; override per environment via .env
    # (SERVER_MEM_LIMIT / SERVER_CPU_LIMIT etc.).
    deploy:
      resources:
        limits:
          cpus: "${SERVER_CPU_LIMIT:-1.0}"
          memory: ${SERVER_MEM_LIMIT:-1g}
        reservations:
          memory: ${SERVER_MEM_RESERVATION:-256m}
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      # Network Traefik uses to reach this container.
      - "traefik.docker.network=${TRAEFIK_NETWORK:-web}"

      # HTTP router -> redirect to HTTPS.
      - "traefik.http.routers.${ROUTER_PREFIX:-gwb}-web.rule=${HOST_RULE:-Host(`api.gewerber.de`)}"
      - "traefik.http.routers.${ROUTER_PREFIX:-gwb}-web.entrypoints=${WEB_ENTRYPOINT:-web}"
      - "traefik.http.routers.${ROUTER_PREFIX:-gwb}-web.middlewares=${ROUTER_PREFIX:-gwb}-https-redirect"

      # HTTPS router (TLS terminated by Traefik).
      - "traefik.http.routers.${ROUTER_PREFIX:-gwb}-secure.rule=${HOST_RULE:-Host(`api.gewerber.de`)}"
      - "traefik.http.routers.${ROUTER_PREFIX:-gwb}-secure.entrypoints=${WEBSECURE_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${ROUTER_PREFIX:-gwb}-secure.tls=true"
      - "traefik.http.routers.${ROUTER_PREFIX:-gwb}-secure.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"

      # Redirect middleware.
      - "traefik.http.middlewares.${ROUTER_PREFIX:-gwb}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-gwb}-https-redirect.redirectscheme.permanent=true"

      # Backend service -> API server port.
      - "traefik.http.services.${ROUTER_PREFIX:-gwb}-backend.loadbalancer.server.port=8080"

      # Backend HTTP health check (only routes to healthy servers).
      - "traefik.http.services.${ROUTER_PREFIX:-gwb}-backend.loadbalancer.healthcheck.path=/readyz"
      - "traefik.http.services.${ROUTER_PREFIX:-gwb}-backend.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.${ROUTER_PREFIX:-gwb}-backend.loadbalancer.healthcheck.timeout=5s"

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: gewerber_backend
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gewerber_backend"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-0.50}"
          memory: ${POSTGRES_MEM_LIMIT:-512m}
        reservations:
          memory: ${POSTGRES_MEM_RESERVATION:-256m}
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pure cache semantics: no RDB snapshots, no AOF (see deploy/README.md,
    # section "Redis" — everything durable lives in PostgreSQL).
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.25}"
          memory: ${REDIS_MEM_LIMIT:-256m}
        reservations:
          memory: ${REDIS_MEM_RESERVATION:-64m}
    networks:
      - internal

networks:
  # Internal network for server <-> postgres/redis traffic.
  internal:
  # External network the existing Traefik container is attached to.
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-web}

volumes:
  pgdata:
